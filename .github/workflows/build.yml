name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Insert provider server
        env:
          PROVIDER_SERVER: ${{ secrets.PROVIDER_SERVER }}
        run: |
          if [ -z "$PROVIDER_SERVER" ]; then echo "Missing PROVIDER_SERVER secret"; exit 1; fi
          sed -i "s#__PROVIDER_SERVER__#${PROVIDER_SERVER%/}#" app/src/main/assets/index.html
          if grep -q "__PROVIDER_SERVER__" app/src/main/assets/index.html; then echo "Server not inserted"; exit 1; fi
      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"
      - name: Unlock signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then echo "Missing SIGNING_PASSWORD secret"; exit 1; fi
          printf %s "$SIGNING_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in app/release.keystore.enc -out app/release.keystore -pass stdin \
            || { echo "SIGNING_PASSWORD is wrong: it does not unlock the signing key"; exit 1; }
      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ProxPrimoPitchside.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ProxPrimoPitchside
          path: ProxPrimoPitchside.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Prox Primo Pitchside ${{ steps.v.outputs.version }}
          body: "Prox Primo Pitchside ${{ steps.v.outputs.version }} (build ${{ github.run_number }})"
          files: ProxPrimoPitchside.apk
